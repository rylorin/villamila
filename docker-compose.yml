# VillaMilaWines website docker stack

services:
  php-fpm-villamila:
    image: bitnami/php-fpm:7.1
    volumes:
      - app:/app:rw
    configs:
      - source: villamila_php.ini_2
        target: /opt/bitnami/php/lib/php.ini
      - source: villamila_fpm.conf
        target: /opt/bitnami/php-fpm/conf/php-fpm.conf
    deploy:
      placement:
        constraints:
          - node.platform.os == linux
          - node.role == manager
      replicas: 0

  web:
    image: caddy:2.4.6-alpine
    volumes:
      - app:/app:ro
    networks:
      - default
      - system_dmz_network
    depends_on:
      - php-fpm
    configs:
      - source: villamila_Caddyfile
        target: /etc/caddy/Caddyfile
    deploy:
      placement:
        constraints:
          - node.platform.os == linux
          - node.role == manager
#         - node.role == worker
      replicas: 0

  static:
    image: nginx:alpine
    volumes:
      - /root/villamila/volumes/static:/usr/share/nginx/html:ro
    networks:
      - default
      - system_dmz_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == vmi3777398
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=system_dmz_network"
        - "traefik.http.routers.villamila.rule=Host(`www.villamilawines.com`) || Host(`en.villamilawines.com`) || Host(`fr.villamilawines.com`) || Host(`hr.villamilawines.com`)"
        - "traefik.http.routers.villamila.entrypoints=websecure"
        - "traefik.http.routers.villamila.tls.certresolver=letsencrypt"
        - "traefik.http.services.villamila.loadbalancer.server.port=80"
      resources:
        limits:
          cpus: '1'
          memory: 1gb

networks:
  default:
  system_dmz_network:
    external: true

configs:
  villamila.conf:
    external: true
  villamila_php.ini_2:
    external: true
  villamila_fpm.conf:
    external: true
  villamila_Caddyfile:
    external: true

volumes:
  app:
